{#
  Email shell, coloured from the deployment's branding settings
  (docs/branding.md). Table layout and inline styles are deliberate: mail
  clients strip <style> blocks, have no flexbox worth relying on, and do not
  support CSS variables -- hence literal hex values from `brand`. No webfonts
  and no remote images either: the header is a text wordmark rather than a
  blocked-by-default logo image.
#}
<div style="margin:0;padding:0;background:{{ brand.surface_hex }};">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{ brand.surface_hex }};padding:28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
          <tr>
            <td style="padding:0 8px 14px 8px;font-family:'Century Gothic','Trebuchet MS',Helvetica,Arial,sans-serif;">
              <span style="font-size:15px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:{{ brand.primary_hex }};">{{ brand.name }}</span>
              <span style="font-size:15px;color:{{ brand.accent_hex }};">&nbsp;·&nbsp;</span>
              <span style="font-size:15px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:{{ brand.primary_hex }};">{{ _('Room booking') }}</span>
            </td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px;background:#ffffff;border-radius:18px;">
          <tr>
            <td style="padding:28px 32px 8px 32px;font-family:'Century Gothic','Trebuchet MS',Helvetica,Arial,sans-serif;">
              <h1 style="margin:0;font-size:21px;line-height:1.3;font-weight:bold;text-transform:uppercase;letter-spacing:.02em;color:{{ brand.primary_hex }};">
                {% block heading %}{{ subject }}{% endblock %}
              </h1>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 32px 30px 32px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:{{ brand.primary_hex }};">
              {% block body %}{% endblock %}
            </td>
          </tr>
        </table>
        <p style="max-width:560px;margin:18px auto 0 auto;padding:0 8px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:rgba({{ brand.primary_rgb }},0.6);">
          {% if brand.email_footer_line %}{{ brand.email_footer_line }}<br>{% endif %}
          {{ _('This message was sent automatically. Please do not reply to it.') }}
        </p>
      </td>
    </tr>
  </table>
</div>
