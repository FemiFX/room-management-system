services:
  minio:
    profiles: ["disabled"]

  minio-init:
    profiles: ["disabled"]

  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
