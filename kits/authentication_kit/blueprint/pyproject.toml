[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authentication-kit-blueprint"
version = "0.1.0"
description = "Extracted OIDC + session auth blueprint from Postbuch"
requires-python = ">=3.12"
dependencies = [
  "authlib>=1.3.2",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "itsdangerous>=2.2.0",
  "pydantic-settings>=2.6.1",
  "python-multipart>=0.0.17",
  "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
]

[tool.setuptools.packages.find]
include = ["authentication_kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
