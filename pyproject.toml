[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "room-management-system-backend"
version = "0.1.0"
description = "Backend API for room management"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13.3",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "email-validator>=2.2.0",
  "authlib>=1.3.2",
  "jinja2>=3.1.4",
  "itsdangerous>=2.2.0",
  "python-multipart>=0.0.17",
  "boto3>=1.35.0",
  "redis>=5.1.1",
  "celery>=5.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
