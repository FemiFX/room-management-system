services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rms
      POSTGRES_USER: rms
      POSTGRES_PASSWORD: rms
    ports:
      - "${RMS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms -d rms"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${RMS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO no longer publishes images on Docker Hub; Chainguard packages the
    # same server. Their free tier publishes only the latest tag.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${RMS_MINIO_PORT:-9002}:9000"
      - "${RMS_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    build: .
    env_file:
      - .env
    environment:
      RMS_S3_AUTO_CREATE_BUCKET: "true"
    command: python scripts/init_minio_buckets.py
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  api:
    build: .
    env_file:
      - .env
    command: /app/entrypoint.sh
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./translations:/app/translations
      - ./scripts:/app/scripts
    ports:
      - "${RMS_API_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    env_file:
      - .env
    command: celery -A app.jobs.celery_app.celery_app worker -l info
    volumes:
      - ./translations:/app/translations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  scheduler:
    build: .
    env_file:
      - .env
    command: celery -A app.jobs.celery_app.celery_app beat -l info
    volumes:
      - ./translations:/app/translations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
